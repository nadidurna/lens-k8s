[package]
name = "k8s-local-lens-tauri"
version = "0.1.0"
description = "Lightweight, zero-login, 100% local Kubernetes desktop client built in Rust"
authors = ["Antigravity Pair Programmer"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["shell-open", "window-create"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }

# Native Kubernetes API client in Rust
kube = { version = "0.93", default-features = false, features = ["client", "config", "runtime"] }
k8s-openapi = { version = "0.22", default-features = false, features = ["v1_30"] }

# Fast local settings and directory discovery
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }
